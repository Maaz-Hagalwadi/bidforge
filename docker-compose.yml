services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: bidforge_auth
      POSTGRES_USER: ${DB_USERNAME:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-admin}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ── Microservices ────────────────────────────────────────────────────────────

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bidforge_auth
      DB_USERNAME: ${DB_USERNAME:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-32plus-chars-here}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_TEST_MODE: ${EMAIL_TEST_MODE:-true}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      APP_SERVER_URL: ${AUTH_SERVER_URL:-http://localhost:8081}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: on-failure
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bidforge_notifications
      DB_USERNAME: ${DB_USERNAME:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      AUTH_SERVICE_URL: http://auth-service:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_TEST_MODE: ${EMAIL_TEST_MODE:-true}

  job-service:
    build:
      context: ./job-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: on-failure
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bidforge_jobs
      DB_USERNAME: ${DB_USERNAME:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      AUTH_SERVICE_URL: http://auth-service:8081
      CONTRACT_SERVICE_URL: http://contract-service:8084
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  contract-service:
    build:
      context: ./contract-service
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: on-failure
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bidforge_contracts
      DB_USERNAME: ${DB_USERNAME:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      AUTH_SERVICE_URL: http://auth-service:8081
      JOB_SERVICE_URL: http://job-service:8083
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

  file-service:
    build:
      context: ./file-service
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    depends_on:
      auth-service:
        condition: service_started
    restart: on-failure
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      APP_SERVER_URL: ${FILE_SERVER_URL:-http://localhost:8085}
      UPLOAD_DIR: /app/uploads
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY:-}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY:-}
      AWS_S3_REGION: ${AWS_S3_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8086:8086"
    depends_on:
      auth-service:
        condition: service_started
    restart: on-failure
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      GROQ_API_KEY: ${GROQ_API_KEY:-}

  admin-service:
    build:
      context: ./admin-service
      dockerfile: Dockerfile
    ports:
      - "8087:8087"
    depends_on:
      auth-service:
        condition: service_started
      job-service:
        condition: service_started
      contract-service:
        condition: service_started
    restart: on-failure
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      JOB_SERVICE_URL: http://job-service:8083
      CONTRACT_SERVICE_URL: http://contract-service:8084

  # ── Gateway (single exposed entry point) ─────────────────────────────────────

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_started
      notification-service:
        condition: service_started
      job-service:
        condition: service_started
      contract-service:
        condition: service_started
      file-service:
        condition: service_started
      ai-service:
        condition: service_started
      admin-service:
        condition: service_started
    restart: on-failure
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      NOTIFICATION_SERVICE_URL: http://notification-service:8082
      NOTIFICATION_WS_URL: ws://notification-service:8082
      JOB_SERVICE_URL: http://job-service:8083
      CONTRACT_SERVICE_URL: http://contract-service:8084
      CONTRACT_WS_URL: ws://contract-service:8084
      FILE_SERVICE_URL: http://file-service:8085
      AI_SERVICE_URL: http://ai-service:8086
      ADMIN_SERVICE_URL: http://admin-service:8087

volumes:
  postgres_data:
