spring.application.name=notification-service
server.port=8082
server.error.include-stacktrace=never

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/bidforge_notifications}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

auth-service.url=${AUTH_SERVICE_URL:http://localhost:8081}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.bidforge.notification.kafka.NotificationEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

resend.api-key=${RESEND_API_KEY:}
app.mail.from=BidForge <noreply@mzdev.co.in>
app.mail.test-mode=${EMAIL_TEST_MODE:true}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
