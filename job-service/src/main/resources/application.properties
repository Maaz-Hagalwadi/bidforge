spring.application.name=job-service
server.port=8083
server.error.include-stacktrace=never

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/bidforge_jobs}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

auth-service.url=${AUTH_SERVICE_URL:http://localhost:8081}
notification-service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8082}
contract-service.url=${CONTRACT_SERVICE_URL:http://localhost:8084}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
