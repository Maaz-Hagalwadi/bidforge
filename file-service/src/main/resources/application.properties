spring.application.name=file-service
server.port=8085
server.error.include-stacktrace=never

auth-service.url=${AUTH_SERVICE_URL:http://localhost:8081}

# File storage
app.upload.dir=${UPLOAD_DIR:uploads}
app.server-url=${APP_SERVER_URL:http://localhost:8085}

# AWS S3 (optional — if not set, falls back to local disk)
aws.access-key=${AWS_ACCESS_KEY:}
aws.secret-key=${AWS_SECRET_KEY:}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
