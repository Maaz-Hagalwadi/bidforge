spring.application.name=auth-service
server.port=8081
server.error.include-stacktrace=never

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/bidforge_auth}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true


spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

jwt.secret=${JWT_SECRET:bidforge-local-dev-secret-key-replace-in-production-xxxxxxx}
jwt.expiration=900000
refresh.token.expiry-days=7

rate-limit.max-requests=10

resend.api-key=${RESEND_API_KEY:}
app.mail.from=BidForge <noreply@mzdev.co.in>
app.mail.test-mode=${EMAIL_TEST_MODE:true}
app.base-url=${APP_BASE_URL:http://localhost:5173}
app.server-url=${APP_SERVER_URL:http://localhost:8081}

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
management.health.redis.enabled=true
management.health.db.enabled=true
