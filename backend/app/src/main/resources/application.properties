spring.application.name=app

# Logging — overridden per profile in logback-spring.xml
logging.level.com.bidforge.app=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/bidforge}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

server.port=8080
server.error.include-stacktrace=never

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
management.health.redis.enabled=true
management.health.db.enabled=true

jwt.secret=${JWT_SECRET:bidforge-local-dev-secret-key-replace-in-production-xxxxxxx}
jwt.expiration=900000

resend.api-key=${RESEND_API_KEY:}
app.mail.from=BidForge <noreply@mzdev.co.in>
app.mail.test-mode=${EMAIL_TEST_MODE:false}
app.base-url=${APP_BASE_URL:http://localhost:5173}
app.server-url=${APP_SERVER_URL:http://localhost:8080}
app.upload-dir=${APP_UPLOAD_DIR:uploads}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}

google.client-id=${GOOGLE_CLIENT_ID:}

groq.api-key=${GROQ_API_KEY:}

aws.access-key=${AWS_ACCESS_KEY:}
aws.secret-key=${AWS_SECRET_KEY:}
aws.s3.region=eu-north-1
aws.s3.bucket=bidforge-storage-2026
